name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout kernelhwsrv
        uses: actions/checkout@v4
        with:
          path: sf/os/kernelhwsrv

      - name: Checkout buildtools
        uses: actions/checkout@v4
        with:
          repository: SymbianSource/oss.FCL.sf.os.buildtools
          path: sf/os/buildtools

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            perl \
            gcc g++ make \
            binutils

      - name: Verify SBS v1 tools
        run: |
          BLDMAKE="sf/os/buildtools/sbsv1_os/e32toolp/bldmake/bldmake.pl"
          ABLD="sf/os/buildtools/sbsv1_os/e32toolp/bldmake/abld.pl"
          echo "Checking SBS v1 build tools..."
          test -f "$BLDMAKE" && echo "bldmake.pl: found" || { echo "bldmake.pl: NOT FOUND"; exit 1; }
          test -f "$ABLD"    && echo "abld.pl: found"    || { echo "abld.pl: NOT FOUND"; exit 1; }

      - name: Validate build configuration
        run: |
          cd sf/os/kernelhwsrv
          echo "Checking bld.inf files..."
          find . -name "bld.inf" | wc -l
          echo "Checking .mmp files..."
          find . -name "*.mmp" | wc -l
          echo "Build configuration validation complete."
